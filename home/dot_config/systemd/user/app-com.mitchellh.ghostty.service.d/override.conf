# Ghostty reports READY=1 before it installs its SIGUSR2 handler. systemd
# refuses to start a notify-reload service whose main process lacks the reload
# signal handler at that point, so cold launches after boot fail with
# "Remote peer disconnected". Plain notify skips the handler check; Ghostty's
# own reload_config keybinding still reloads its configuration.
[Service]
Type=notify
