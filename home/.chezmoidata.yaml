# Machine capabilities, one boolean each. `headless` is "nothing attached draws
# pixels"; `dev` is "development tooling and agent configuration belong here";
# `personal` is "my own accounts and services belong here". They are
# independent: a desktop is headless false and the other two true, the Debian
# server is headless true, dev false and personal true, a container or cloud
# sandbox is all three true, and a work machine is a desktop with personal
# false.
#
# `personal` gates the homelab SSH hosts, the macOS login items, and the
# helper the login items call. The Git email is prompted for separately, since
# it varies per machine rather than per machine type.
#
# The values below are the desktop answers. They resolve every key on a machine
# that never ran chezmoi init; anywhere init has run, the config file it writes
# takes precedence. That config template cannot read this file, so each prompt
# there repeats the default rather than reading it from here.
headless: false
dev: true
personal: true
email: vsharha07@gmail.com
